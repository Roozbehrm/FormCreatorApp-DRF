services:
  db:
    image: postgres:16-alpine
    env_file: [.env]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine

  web:
    build: {context: ., dockerfile: docker/Dockerfile}
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3
    env_file: [.env]
    environment: {DJANGO_SETTINGS_MODULE: config.settings.production}
    volumes: [static_volume:/app/staticfiles, media_volume:/app/media]
    depends_on:
      db: {condition: service_healthy}

  daphne:
    build: {context: ., dockerfile: docker/Dockerfile}
    command: daphne -b 0.0.0.0 -p 9000 config.asgi:application
    env_file: [.env]
    environment: {DJANGO_SETTINGS_MODULE: config.settings.production}
    depends_on: [redis, db]

  worker:
    build: {context: ., dockerfile: docker/Dockerfile}
    command: celery -A config worker -l info
    env_file: [.env]
    environment: {DJANGO_SETTINGS_MODULE: config.settings.production}
    depends_on: [redis, db]

  beat:
    build: {context: ., dockerfile: docker/Dockerfile}
    command: celery -A config beat -l info
    env_file: [.env]
    environment: {DJANGO_SETTINGS_MODULE: config.settings.production}
    depends_on: [redis, db]

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
      - ./deploy/nginx/acme-challenge:/var/www/certbot:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    ports: ["80:80", "443:443"]
    depends_on: [web, daphne]

volumes:
  pgdata:
  static_volume:
  media_volume:
